[package]
name = "rproxy"
version = "0.2.0"
edition = "2024"
publish = false
description = "Proxy manager: kernel + plugins, one egui UI for the desktop window and the browser"

[features]
default = ["desktop"]
desktop = ["dep:plugin-autostart", "dep:eframe", "dep:ksni", "dep:rfd", "dep:winit", "dep:zbus", "dep:futures-util", "dep:tray-icon", "dep:objc2", "dep:objc2-app-kit"]

[dependencies]
rproxy-kernel = { path = "crates/kernel" }
rproxy-contracts = { path = "crates/contracts" }
rproxy-remote = { path = "crates/remote" }
egui = { workspace = true, features = ["default_fonts"] }
eframe = { workspace = true, optional = true }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"], optional = true }
tokio = { workspace = true }
axum = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
image = { workspace = true }
plugin-servers = { path = "plugins/servers" }
plugin-subscriptions = { path = "plugins/subscriptions" }
plugin-format-uri = { path = "plugins/format-uri" }
plugin-format-xray = { path = "plugins/format-xray" }
plugin-format-clash = { path = "plugins/format-clash" }
plugin-name-filters = { path = "plugins/name-filters" }
plugin-routing = { path = "plugins/routing" }
plugin-inbounds = { path = "plugins/inbounds" }
plugin-health-checks = { path = "plugins/health-checks" }
plugin-auto-select = { path = "plugins/auto-select" }
plugin-autostart = { path = "plugins/autostart", optional = true }
plugin-exit-server = { path = "plugins/exit-server" }
plugin-vless-server = { path = "plugins/vless-server" }
plugin-connections = { path = "plugins/connections" }
plugin-logs = { path = "plugins/logs" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", optional = true }
# Standard window controls when the Wayland compositor delegates decorations.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"], optional = true }
zbus = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# AttachConsole for `rproxy web` started from a terminal.
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"], optional = true }

[dev-dependencies]
tempfile = "3.27"
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }

[workspace]
members = ["crates/*", "plugins/*"]
default-members = [".", "crates/*", "plugins/*"]
resolver = "2"

[workspace.dependencies]
egui = { version = "0.37.0", default-features = false, features = ["serde"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "clipboard", "accesskit"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "deflate", "socks", "query"] }
uuid = { version = "1.29", features = ["v4", "v5", "serde"] }
url = "2.5.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
futures-util = "0.3.34"
tempfile = "3.27"
base64 = "0.23.1"
flate2 = "1.1.11"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
windows-sys = "0.61.2"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Smaller binary means less code resident in RAM.
lto = "fat"
codegen-units = 1
strip = true

[profile.web]
inherits = "release"
opt-level = "s"
# wasm-bindgen reads the target_features section that `strip = true` removes.
strip = "debuginfo"
