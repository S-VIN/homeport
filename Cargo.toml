[package]
name = "rproxy"
version = "0.2.0"
edition = "2021"
publish = false
description = "Proxy manager: kernel + plugins, one egui UI for the desktop window and the browser"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:ksni"]

[dependencies]
rproxy-kernel = { path = "crates/kernel" }
rproxy-remote = { path = "crates/remote" }
egui = { workspace = true, features = ["default_fonts"] }
eframe = { workspace = true, optional = true }
tokio = { workspace = true }
axum = { workspace = true }
url = { workspace = true }
image = { workspace = true }
plugin-servers = { path = "plugins/servers" }
plugin-subscriptions = { path = "plugins/subscriptions" }
plugin-format-uri = { path = "plugins/format-uri" }
plugin-format-xray = { path = "plugins/format-xray" }
plugin-format-clash = { path = "plugins/format-clash" }
plugin-name-filters = { path = "plugins/name-filters" }
plugin-routing = { path = "plugins/routing" }
plugin-inbounds = { path = "plugins/inbounds" }
plugin-health-checks = { path = "plugins/health-checks" }
plugin-auto-select = { path = "plugins/auto-select" }
plugin-autostart = { path = "plugins/autostart" }
plugin-exit-server = { path = "plugins/exit-server" }
plugin-vless-server = { path = "plugins/vless-server" }
plugin-connections = { path = "plugins/connections" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", optional = true }

[dev-dependencies]
tempfile = "3.27"
serde_json = { workspace = true }
base64 = "0.23"
reqwest = { workspace = true }

[workspace]
members = ["crates/*", "plugins/*"]
default-members = [".", "crates/*", "plugins/*"]
resolver = "2"

[workspace.dependencies]
egui = { version = "0.37.0", default-features = false, features = ["serde"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "deflate", "socks", "query"] }
uuid = { version = "1.29", features = ["v4", "v5", "serde"] }
url = "2.5.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
futures-util = "0.3.34"
tempfile = "3.27"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "debuginfo"

[profile.web]
inherits = "release"
opt-level = "s"
