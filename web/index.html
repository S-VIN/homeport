<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>rproxy</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="icon" href="/icon.png" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="/icon.png">
<style>html,body{margin:0;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#runway{height:1000vh}body{background:#f3f4f7;color:#1c212a;font:14px system-ui}@media (prefers-color-scheme:dark){body{background:#111317;color:#e6e9ef}}#status{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:none}#status::before{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}</style>
<canvas id="app" aria-label="rproxy"></canvas><div id="runway" aria-hidden="true"></div><div id="status" role="status">Loading rproxy…</div>
<script type="module">
import init, { start } from "./rproxy_remote.js";
// Programmatic page scrolling (assistive tools, automation) becomes a wheel
// event over the middle of the canvas, where the page content scrolls.
// Real wheel events go to the canvas directly and never scroll the page.
const canvas = document.getElementById("app");
const middle = () => Math.round(window.innerHeight * 4.5);
window.scrollTo(0, middle());
window.addEventListener("scroll", () => {
  const delta = window.scrollY - middle();
  if (delta === 0) return;
  window.scrollTo(0, middle());
  const [x, y] = [window.innerWidth / 2, window.innerHeight / 2];
  canvas.dispatchEvent(new WheelEvent("wheel", { clientX: x, clientY: y, deltaY: delta, deltaMode: 0, bubbles: true, cancelable: true }));
});
window.addEventListener("resize", () => window.scrollTo(0, middle()));
window.save_configuration = function(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], {type: 'application/vnd.sqlite3'}));
  const link = document.createElement('a');
  link.href = url; link.download = name;
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
window.open_configuration = function(limit) {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.sqlite3'; input.hidden = true;
    document.body.append(input);
    input.addEventListener('cancel', () => { input.remove(); resolve(null); }, {once:true});
    input.addEventListener('change', async () => {
      try {
        const file = input.files[0];
        if (!file) { resolve(null); return; }
        if (file.size > limit) throw new Error('Configuration exceeds the 32 MiB file limit.');
        resolve({name:file.name, bytes:new Uint8Array(await file.arrayBuffer())});
      } catch(e) { reject(e); } finally { input.remove(); }
    }, {once:true});
    input.click();
  });
}
try { await init(); await start(canvas); }
catch (error) { document.getElementById("status").textContent = "Could not open rproxy. " + error; }
</script></html>
