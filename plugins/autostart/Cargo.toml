[package]
name = "plugin-autostart"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
rproxy-kernel = { path = "../../crates/kernel" }

# Flatpak: the Background portal (same zbus as the desktop shell).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
