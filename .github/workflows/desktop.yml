name: Desktop application
# Every push to master and every pull request runs the checks.
# Run workflow (manual) or a v* tag also builds the six desktop packages.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The browser client needs no mihomo binaries.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/mihomo/*/*/
      - uses: Swatinem/rust-cache@v2
        with:
          # wasm-bindgen CLI (pinned to Cargo.lock) lives outside target/.
          cache-directories: .cache/wasm-bindgen
      - run: python3 scripts/build.py --web-only
      - name: Browser decoding test (wasm32, Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/.cache/wasm-bindgen/bin/wasm-bindgen-test-runner
        run: cargo test --locked -p rproxy-remote --target wasm32-unknown-unknown --test wasm_decode
      - uses: actions/upload-artifact@v7
        with:
          name: web-painter
          path: web/pkg
          if-no-files-found: error
          retention-days: 7

  check:
    needs: web
    name: check-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, runner: ubuntu-24.04}
          - {os: win32, runner: windows-2025}
          - {os: darwin, runner: macos-26}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # End-to-end tests run the real Linux x64 core; other OSes only compile.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/mihomo/*/*/
            /assets/mihomo/linux/x64/
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: web-painter
          path: web/pkg
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: matrix.os == 'linux'
        run: python3 scripts/mihomo.py --os linux --arch x64 && cargo test --workspace --locked

  package:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: win32, arch: x64, runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {os: win32, arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {os: darwin, arch: x64, runner: macos-26-intel, target: x86_64-apple-darwin}
          - {os: darwin, arch: arm64, runner: macos-26, target: aarch64-apple-darwin}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Only this platform's mihomo binary.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/mihomo/*/*/
            /assets/mihomo/${{ matrix.os }}/${{ matrix.arch }}/
      # rust-toolchain.toml selects the version; this adds the target triple.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: web-painter
          path: web/pkg
      - name: Linux packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder imagemagick zstd
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Flatpak's bubblewrap needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Windows installer tools
        if: matrix.os == 'win32'
        run: choco install nsis --no-progress -y
      - run: python scripts/build.py --native-only --release
      - run: python scripts/package.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: rproxy-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.flatpak
            dist/*.pkg.tar.zst
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          # Installers and archives are already compressed.
          compression-level: 0
      # After the upload, so a failing smoke test still leaves the packages to inspect.
      - name: Smoke-test the packages
        run: python scripts/package.py --check --os ${{ matrix.os }} --arch ${{ matrix.arch }}
