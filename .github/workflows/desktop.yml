name: desktop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
jobs:
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The browser client needs no mihomo binaries.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/mihomo/*/*/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: rustup toolchain install
      - id: build-env
        run: python scripts/build.py --prepare-ci
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ${{ steps.build-env.outputs.cache-target }}
          # wasm-bindgen CLI (pinned to Cargo.lock) lives outside target/.
          cache-directories: .cache/wasm-bindgen
      - run: python3 scripts/build.py --web-only
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: web-painter
          path: web/pkg
          if-no-files-found: error
          retention-days: 7

  package:
    needs: web
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux packages stay on 24.04: its glibc 2.39 is the binaries' minimum (26.04 has 2.43).
          - {os: linux, arch: x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: win32, arch: x64, runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {os: win32, arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {os: darwin, arch: x64, runner: macos-26-intel, target: x86_64-apple-darwin}
          - {os: darwin, arch: arm64, runner: macos-26, target: aarch64-apple-darwin}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Only this platform's mihomo binary.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/assets/mihomo/*/*/
            /assets/mihomo/${{ matrix.os }}/${{ matrix.arch }}/
      # Each runner builds for its own architecture; no explicit --target.
      - run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - id: build-env
        run: python scripts/build.py --prepare-ci ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ${{ steps.build-env.outputs.cache-target }}
      - uses: actions/download-artifact@v8
        with:
          name: web-painter
          path: web/pkg
      - name: Linux packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          # rsvg-convert renders PNGs; Flatpak also needs the GdkPixbuf SVG loader to export SVGs.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-bin librsvg2-common zstd
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Flatpak's bubblewrap needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Windows installer tools
        if: matrix.os == 'win32'
        # upgrade also replaces an older preinstalled NSIS (windows-11-arm ships 3.10).
        run: choco upgrade nsis --version 3.13.0 --no-progress -y
      - run: python scripts/build.py --native-only --release
      - run: python scripts/package.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/rproxy-*.exe
            dist/rproxy-*.zip
            dist/rproxy-*.dmg
            dist/rproxy-*.AppImage
            dist/rproxy-*.flatpak
            dist/rproxy-*.pkg.tar.zst
            dist/rproxy-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          # Installers and archives are already compressed.
          compression-level: 0

  artifacts:
    needs: [web, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      # Keep both native architectures in one download per OS.
      - uses: actions/upload-artifact/merge@v7
        with:
          name: rproxy-windows
          pattern: packages-win32-*
          delete-merged: true
          compression-level: 0
      - uses: actions/upload-artifact/merge@v7
        with:
          name: rproxy-linux
          pattern: packages-linux-*
          delete-merged: true
          compression-level: 0
      - uses: actions/upload-artifact/merge@v7
        with:
          name: rproxy-macos
          pattern: packages-darwin-*
          delete-merged: true
          compression-level: 0
      - name: Remove the intermediate browser artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_ARTIFACT_ID: ${{ needs.web.outputs.artifact-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$WEB_ARTIFACT_ID"
