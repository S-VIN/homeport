name: homeport

x-service: &service
  restart: unless-stopped
  network_mode: host
  # Docker creates bind directories as root. No UID setup or chown container needed.
  user: "0:0"
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: "${LOG_MAX_FILES:-3}"

services:
  homeport:
    <<: *service
    image: ${HOMEPORT_IMAGE:-ghcr.io/s-vin/homeport:latest}
    init: true
    environment:
      HOMEPORT_LISTEN: 127.0.0.1:${HOMEPORT_UI_PORT:-20800}
      TZ: ${TZ:-UTC}
      HOMEPORT_PUBLIC_ORIGIN: https://${HOMEPORT_PANEL_DOMAIN:?Set HOMEPORT_PANEL_DOMAIN}:${HTTPS_PORT:-8443}
      # Read once, when the image's preset starts a new installation (presets/server.rs).
      HOMEPORT_VLESS_DOMAIN: ${VLESS_DOMAIN:-${HOMEPORT_PANEL_DOMAIN}}
    volumes:
      - ${DATA_DIR:?Set DATA_DIR}/homeport:/data:Z
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://127.0.0.1:${HOMEPORT_UI_PORT:-20800}/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  tinyauth:
    <<: *service
    image: ${TINYAUTH_IMAGE:-ghcr.io/tinyauthapp/tinyauth:v5}
    working_dir: /data
    environment:
      TZ: ${TZ:-UTC}
      TINYAUTH_USERNAME: ${TINYAUTH_USERNAME:?Set TINYAUTH_USERNAME}
      TINYAUTH_PASSWORD: ${TINYAUTH_PASSWORD:?Set TINYAUTH_PASSWORD}
      TINYAUTH_APPURL: https://${HOMEPORT_AUTH_DOMAIN:?Set HOMEPORT_AUTH_DOMAIN}:${HTTPS_PORT:-8443}
      TINYAUTH_SERVER_ADDRESS: 127.0.0.1
      TINYAUTH_SERVER_PORT: ${TINYAUTH_PORT:-20801}
      TINYAUTH_AUTH_SECURECOOKIE: "true"
      TINYAUTH_AUTH_TRUSTEDPROXIES: 127.0.0.1/32
      TINYAUTH_DATABASE_PATH: /data/tinyauth.db
      TINYAUTH_ANALYTICS_ENABLED: "false"
    # Tinyauth's own CLI handles bcrypt; the plaintext is not written to its database.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        generated="$$(tinyauth user create --username "$$TINYAUTH_USERNAME" --password "$$TINYAUTH_PASSWORD")"
        hash="$$(printf '%s\n' "$$generated" | grep -oE '\$$2[aby]\$$[0-9]{2}\$$[./A-Za-z0-9]{53}' | head -n 1)"
        test -n "$$hash" || { echo 'Cannot generate Tinyauth credentials' >&2; exit 1; }
        export TINYAUTH_AUTH_USERS="$$TINYAUTH_USERNAME:$$hash"
        unset TINYAUTH_USERNAME TINYAUTH_PASSWORD generated hash
        exec tinyauth
    volumes:
      - ${DATA_DIR:?Set DATA_DIR}/tinyauth:/data:Z
    healthcheck:
      test: [CMD, tinyauth, healthcheck]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  caddy:
    <<: *service
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    depends_on:
      homeport:
        condition: service_healthy
      tinyauth:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      HOMEPORT_PANEL_DOMAIN: ${HOMEPORT_PANEL_DOMAIN}
      HOMEPORT_AUTH_DOMAIN: ${HOMEPORT_AUTH_DOMAIN}
      HOMEPORT_UI_PORT: ${HOMEPORT_UI_PORT:-20800}
      TINYAUTH_PORT: ${TINYAUTH_PORT:-20801}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      CADDY_BIND: ${CADDY_BIND:-0.0.0.0}
      ACME_EMAIL: ${ACME_EMAIL:-}
      WS_MAX_DURATION: ${WS_MAX_DURATION:-1h}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ${DATA_DIR:?Set DATA_DIR}/caddy/data:/data:Z
      - ${DATA_DIR:?Set DATA_DIR}/caddy/config:/config:Z
    cap_add: [NET_BIND_SERVICE]
