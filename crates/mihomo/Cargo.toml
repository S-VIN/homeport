[package]
name = "rproxy-mihomo"
version = "0.2.0"
edition = "2024"
publish = false
description = "Typed mihomo configuration, process supervisor and controller API"

[dependencies]
rproxy-core-helper = { path = "../core-helper" }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# TLS for reqwest uses ring, like the rest of the app (one crypto library).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = { workspace = true }
ipnet = "2.12"
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
