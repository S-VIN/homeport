[package]
name = "homeport-mihomo"
version = "0.2.0"
edition = "2024"
publish = false
description = "Typed mihomo configuration, process supervisor and controller API"

[dependencies]
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# TLS for reqwest uses ring, like the rest of the app (one crypto library).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = { workspace = true }
ipnet = "2.12"
log = "0.4.35"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
