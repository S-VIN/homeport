[package]
name = "rproxy-mihomo"
version = "0.2.0"
edition = "2021"
publish = false
description = "Typed mihomo configuration, process supervisor and controller API"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
ipnet = "2.12"
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
uuid = { workspace = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
