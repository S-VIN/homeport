[package]
name = "rproxy-kernel"
version = "0.2.0"
edition = "2021"
publish = false
description = "rproxy kernel: plugins, state, ops, events, UI zones and the mihomo core"

[dependencies]
rproxy-derive = { path = "../derive" }
rproxy-kit = { path = "../kit" }
rproxy-mihomo = { path = "../mihomo" }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = { workspace = true }
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint", "backup"] }
uuid = { workspace = true }
getrandom = "0.4"
reqwest = { workspace = true }
sha2 = "0.11.1"

[target.'cfg(not(windows))'.dependencies]
flate2 = "1.1.11"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
