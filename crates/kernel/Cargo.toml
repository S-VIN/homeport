[package]
name = "homeport-kernel"
version = "0.2.0"
edition = "2024"
publish = false
description = "homeport kernel: plugins, state, ops, events, UI zones and the mihomo core"

[dependencies]
homeport-derive = { path = "../derive" }
homeport-kit = { path = "../kit" }
homeport-mihomo = { path = "../mihomo" }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = { workspace = true }
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint", "backup", "functions"] }
uuid = { workspace = true }
getrandom = "0.4"
same-file = "1.0.6"
tempfile = { workspace = true }
reqwest = { workspace = true }
sha2 = "0.11.1"
log = "0.4.35"

[target.'cfg(not(windows))'.dependencies]
flate2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
