[package]
name = "rproxy-kit"
version = "0.2.0"
edition = "2024"
publish = false
description = "rproxy design system for egui: tokens, palette, fonts, icons, widgets"

[dependencies]
egui = { workspace = true }
# Only enables color glyphs (emoji) in egui's own text rendering.
epaint = { version = "0.37.0", default-features = false, features = ["color_fonts"] }
qrcode = { version = "0.14.1", default-features = false }
