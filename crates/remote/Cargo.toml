[package]
name = "homeport-remote"
version = "0.2.0"
edition = "2024"
publish = false
description = "Remote egui: run the UI on the host, paint it in a browser"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
egui = { workspace = true }
serde = { workspace = true }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
miniz_oxide = "0.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["WebSocket", "BinaryType", "MessageEvent", "Window", "Location", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Node", "EventTarget", "Event", "MouseEvent", "WheelEvent", "DomRect", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
homeport-kernel = { path = "../kernel" }
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
